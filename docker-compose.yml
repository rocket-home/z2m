# Cap container log size so MAC-no-ack spam can't fill the SD card.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mqtt:
    build: ./mosquitto/
    ports:
      - 1883:1883
      - 9001:9001
    volumes:
      - mosquitto:/mosquitto/data
      - ./mosquitto/conf.d:/mosquitto/conf.d:ro
      - mosquitto_etc:/mosquitto/etc
    environment:
      - MQTT_USER=${MQTT_USER:-user}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
    # Pin the cloud broker IP so the bridge survives in-container DNS hiccups.
    # Defaults keep `docker compose up` valid when CLOUD_MQTT_IP is unset (e.g. cloud
    # disabled): an empty IP makes Docker reject the entire stack ("invalid IP address").
    extra_hosts:
      - "${CLOUD_MQTT_HOST:-cloud.invalid}:${CLOUD_MQTT_IP:-127.0.0.1}"
    restart: unless-stopped
    logging: *default-logging
    # $$SYS/broker/version is retained -> returns immediately. Broker requires auth
    # (allow_anonymous false), so the probe authenticates with the container's MQTT creds.
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -u \"$$MQTT_USER\" -P \"$$MQTT_PASSWORD\" -t '$$SYS/broker/version' -C 1 -W 3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  nodered:
    image: nodered/node-red
    user: "${UID:-1000}:${GID:-1000}"
    profiles:
      - nodered
    ports:
      - 1880:1880
    volumes:
      - nodered:/data
    restart: unless-stopped
    logging: *default-logging
  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:1.42.0
    ports:
      - 4000:4000
    devices:
      # Docker не принимает symlink как "device node", поэтому:
      # - ZIGBEE_DEVICE_HOST: реальный /dev/tty* на хосте
      # - ZIGBEE_DEVICE: путь устройства внутри контейнера (по умолчанию /dev/zigbee)
      - "${ZIGBEE_DEVICE_HOST:-/dev/ttyACM0}:${ZIGBEE_DEVICE:-/dev/zigbee}"
    volumes:
      - zigbee2mqtt:/app/data
      - ./zigbee2mqtt.yaml:/app/data/configuration.yaml
    restart: unless-stopped
    logging: *default-logging
    # Image ships wget (no curl); frontend serves / -> 200. Generous start_period for
    # coordinator init. Healthcheck = visibility only (unless-stopped doesn't restart unhealthy).
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:4000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
volumes:
  mosquitto:
  mosquitto_etc:
  nodered:
  zigbee2mqtt:
